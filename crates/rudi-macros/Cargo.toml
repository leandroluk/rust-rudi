[package]
name = "rudi-macros"
version = "0.1.0"
edition = "2021"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.3", features = ["full", "extra-traits"] }

[dev-dependencies]
rudi = { path = "../rudi" }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt", "macros", "rt-multi-thread"] }
trybuild = "1.0.118"
