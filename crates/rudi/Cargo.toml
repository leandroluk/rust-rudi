[package]
name = "rudi"
version = "0.1.0"
edition = "2021"

[dependencies]
rudi-macros = { version = "0.1.0", path = "../rudi-macros" }
thiserror = "2.0.19"
tokio = { version = "1.53.1", default-features = false, features = ["sync"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt", "macros", "rt-multi-thread"] }
